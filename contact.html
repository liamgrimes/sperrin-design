<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Sperrin Design</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

<div data-site-header></div>

<main>

  <h1>Contact</h1>

  <!-- CONTACT FORM -->
 <section id="contact-form">
  <h2>Get in touch</h2>

  <form id="contact-form-element">
    <label for="name">Name</label>
    <input id="name" type="text" name="name" required />

    <label for="email">Email</label>
    <input id="email" type="email" name="email" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send</button>
  </form>
</section>

<script>
  const form = document.getElementById('contact-form-element');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      message: document.getElementById('message').value
    };

    try {
      const response = await fetch('/api/contact', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || 'Failed to send message');
      }

      alert('Message sent successfully.');
      form.reset();
    } catch (error) {
      alert(error.message || 'Something went wrong.');
    }
  });
</script>

  <!-- SOCIAL LINKS -->
  <section id="social-links">
    <h2>Follow Sperrin Design</h2>

    <p>Stay updated with new collections, behind-the-scenes work, and upcoming projects.</p>

    <ul>
      <li>
        <u><b><a href="https://www.instagram.com/sperrindesign/" target="_blank" rel="noopener noreferrer">
          Instagram
        </a></b></u>
      </li>

      <li>
        <u><b><a href="https://www.tiktok.com/@karen..hegarty" target="_blank" rel="noopener noreferrer">
          TikTok
        </a></b></u>
      </li>

      <li>
        <u><b><a href="https://www.depop.com/sperrindesign/" target="_blank" rel="noopener noreferrer">
          Depop Shop
        </a></b></u>
      </li>
    </ul>
  </section>

</main>

<div data-site-footer></div>

<script src="assets/js/main.js"></script>
</body>
</html>
